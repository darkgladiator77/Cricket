<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Cricket World</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="contact-page">
    <header>
        <nav>
            <ul>
                <li><a href="index.html" class="button">Home</a></li>
                <li><a href="about.html" class="button">About</a></li>
                <li><a href="teams.html" class="button">Teams</a></li>
                <li><a href="matches.html" class="button">Matches</a></li>
                <li><a href="contact.html" class="button">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="content-box">
            <h1>Contact Us</h1>
            <p>Have questions? Get in touch with us through the contact form below.</p>
            <form id="contactForm">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <button type="submit" class="button">Send Message</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Cricket World. All rights reserved.</p>
    </footer>
    <script src="scripts.js"></script>
</body>
</html>
